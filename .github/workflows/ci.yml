name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import solution
        run: python -c "import solution; solution.detect_events; solution.RiskEstimator"
      - name: Validate example predictions
        run: python evaluate.py --pred examples/predictions.json --validate-only
