name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: pip install -r requirements.txt pytest --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: pytest -q
      - name: Validate example predictions
        run: python evaluate.py --pred examples/predictions.json --validate-only

  clean-container:
    # Mirrors a bare eval machine: slim image, no GUI libs, no internet at runtime.
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (CPU torch)
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Import solution + cv2 + ultralytics offline
        env:
          YOLO_OFFLINE: "1"
        run: python -c "import cv2, solution; from ultralytics import YOLO; print('cv2', cv2.__version__, 'OK')"
